<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>JenaWeb — J-shaped frame holding a globe, with a rotated rear sheet</title>
  <defs>
    <!-- Same clearance mask as the other Jena app icons: the foreground frame
         expanded by 52px keeps a constant gap to the rear card. -->
    <mask id="rear-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <rect x="192" y="202" width="656" height="566" rx="126" fill="black"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="188" fill="#14243A"/>
  <g transform="translate(36 -27)">
    <g mask="url(#rear-clearance)">
      <g transform="translate(-45 110) rotate(12 520 485)">
        <rect x="244" y="254" width="552" height="462" rx="42" fill="white"/>
      </g>
    </g>
    <path d="M500 280 H722 A48 48 0 0 1 770 328 V642 A48 48 0 0 1 722 690 H318 A48 48 0 0 1 270 642 V555"
          fill="none" stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Globe: outline, one meridian, equator. -->
    <g fill="none" stroke="white" stroke-linecap="round">
      <circle cx="518" cy="492" r="116" stroke-width="40"/>
      <ellipse cx="518" cy="492" rx="50" ry="116" stroke-width="30"/>
      <path d="M402 492 H634" stroke-width="30"/>
    </g>
  </g>
</svg>
